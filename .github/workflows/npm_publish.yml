name: Publish npm package
on:
  push:
    branches: main
jobs:
  npm_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - uses: mlugg/setup-zig@v2
        with:
          version: master
          use-cache: false
      - name: Run tests
        run: zig build test --summary new
      - name: Build wasm32-wasi
        run: zig build --summary new --release=small -Dtarget=wasm32-wasi
      - name: Get version
        id: version
        run: echo "version=$(zig build run -- version)" >> "$GITHUB_OUTPUT"
      - name: Set npm version
        run: npm version --allow-same-version --no-git-tag-version ${{ steps.version.outputs.version }}
      - name: Publish latest
        if: ${{ !contains(steps.version.outputs.version, 'dev') }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish dev
        if: ${{ contains(steps.version.outputs.version, 'dev') }}
        run: npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
